[build]
  command = "npm run build"
  publish = "dist"

# React Router uses client-side routing (e.g. /projects/real-estate-platform).
# Without this, refreshing or directly visiting a route returns a 404 from Netlify's
# server, since only /index.html actually exists as a static file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
